<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clo Reyna — Archivo</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0A}
a{color:#F2EFEA;text-decoration:none}a:hover{color:#FFFFFF;text-decoration:underline}
</style>
</helmet>
<div style="background: #0A0A0A; color: #F2EFEA; font-family: 'IBM Plex Mono', ui-monospace, monospace; min-height: 100vh">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding: 24px 4%; border-bottom: 1px solid #2E2E2E; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em">
<a href="Hibrido.dc.html" style="font-family: 'Bodoni Moda', serif; font-size: 22px; letter-spacing: 0.3em; text-transform: none">CLO REYNA</a>
<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 28px">
<a href="Archivo-completo.dc.html" aria-current="page" style="border-bottom: 1px solid #F2EFEA">Archivo</a>
<a href="Hibrido.dc.html">Info</a>
<a href="Booking.dc.html">Booking</a>
<a href="#top" aria-label="Cambiar idioma a inglés">ES / EN</a>
</nav>
</header>

<section id="top" style="padding: 64px 4% 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; border-bottom: 1px solid #2E2E2E">
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #A8A39B">{{count}} proyectos</p>
<h1 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(72px, 10vw, 144px); line-height: 0.88">Archivo</h1>
</div>
<div role="group" aria-label="Filtrar por tipo" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; text-transform: uppercase">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<sc-if value="{{f.on}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{f.pick}}" aria-pressed="true" style="padding: 12px 18px; min-height: 44px; font-family: inherit; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; border: 1px solid #F2EFEA; background: #F2EFEA; color: #0A0A0A">{{f.label}}</button>
</sc-if>
<sc-if value="{{f.off}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{f.pick}}" aria-pressed="false" style="padding: 12px 18px; min-height: 44px; font-family: inherit; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; border: 1px solid #5A5650; background: transparent; color: #F2EFEA">{{f.label}}</button>
</sc-if>
</sc-for>
</div>
</section>

<section aria-label="Proyectos" style="padding: 56px 4% 96px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 56px 24px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="12">
<a href="{{item.href}}" style="display: flex; flex-direction: column; gap: 14px">
<img src="{{item.img}}" alt="{{item.alt}}" style="width: 100%; height: 420px; object-fit: cover">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<span style="font-family: 'Bodoni Moda', serif; font-size: 26px">{{item.num}} — {{item.title}}</span>
<span style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #A8A39B">{{item.cat}}</span>
</span>
</a>
</sc-for>
</section>

<section style="padding: 72px 4%; background: #F2EFEA; color: #0A0A0A; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 32px">
<h2 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 56px; line-height: 1">¿Tienes un <i>shoot?</i></h2>
<a href="Booking.dc.html" style="padding: 18px 40px; background: #0A0A0A; color: #F2EFEA; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase">Booking</a>
</section>

<footer style="padding: 28px 4%; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; color: #A8A39B">
<span>© Clo Reyna Hairstyling — CDMX</span>
<a href="https://www.instagram.com/clo.stylistroom/" style="color: #A8A39B">@clo.stylistroom</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2700}}'>
var PROYECTOS = [
{ num: '01', title: 'Dior', cat: 'Campaña', img: './assets/84939cf137e8077230b21f1373cfcfa0.jpg', alt: 'Campaña Dior en blanco y negro', href: 'Proyecto-Dior.dc.html' },
{ num: '02', title: 'Cartier', cat: 'Editorial', img: './assets/3c9f6468d5f9d1e0561dcf14422c9572.jpg', alt: 'Editorial Cartier con bob negro', href: 'Proyecto-Cartier.dc.html' },
{ num: '03', title: 'Glamour MX — Carla Morrison', cat: 'Portada', img: './assets/4808986e25f7deadc0ab48fe81c5f557.jpg', alt: 'Portada de Glamour México con Carla Morrison', href: '#top' },
{ num: '04', title: 'Matisse — El ayer', cat: 'Música', img: './assets/260db3268d28b1b4234e9c5e0df543bf.jpg', alt: 'Portada del sencillo El ayer de Matisse', href: '#top' },
{ num: '05', title: 'Elle México', cat: 'Editorial', img: './assets/75213172127f1a09e2f4e528a2455afc.jpg', alt: 'Editorial Elle México con fleco esculpido', href: '#top' },
{ num: '06', title: 'Editorial Corea', cat: 'Portada', img: './assets/5a438470d6975e1706d8b9b7c48f1cc1.jpg', alt: 'Portada editorial coreana en blanco y negro', href: '#top' },
{ num: '07', title: 'Yuya', cat: 'Campaña', img: './assets/69fff80fd61cd673a071c0ca47779688.jpg', alt: 'Campaña Yuya: trenza larga y fondo verde', href: '#top' },
{ num: '08', title: 'Bailando Juntos', cat: 'Campaña', img: './assets/181edd957f58b3c4ca3b0e4f0fa298ce.jpg', alt: 'Campaña Bailando Juntos', href: '#top' },
{ num: '09', title: 'Glamour MX — Cristy Camacho', cat: 'Portada', img: './assets/d579a95ac4ab4b1060fcda002830fe42.jpg', alt: 'Portada de Glamour México con Cristy Camacho', href: '#top' },
{ num: '10', title: 'Elle México II', cat: 'Editorial', img: './assets/bca916e0d2fb13d74cb22b6ebfe9024e.jpg', alt: 'Elle México: recogido con rizos sueltos', href: '#top' },
{ num: '11', title: 'Editorial Corea — color', cat: 'Portada', img: './assets/af20ccd71d213f54d10cf870a632e25e.jpg', alt: 'Portada coreana con pelo rosa', href: '#top' },
{ num: '12', title: '[Cliente] Beauty', cat: 'Campaña', img: './assets/0d8c854c547dd537174ff12c3cfebcdb.jpg', alt: 'Trenzas finas con labial nude', href: '#top' }
];
var FILTROS = ['Todo', 'Editorial', 'Campaña', 'Música', 'Portada'];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'Todo' };
}
renderVals() {
var cur = this.state.filter;
var items = cur === 'Todo' ? PROYECTOS : PROYECTOS.filter(function (p) { return p.cat === cur; });
var self = this;
var filters = FILTROS.map(function (label) {
var on = label === cur;
return {
label: label,
on: on,
off: !on,
pick: function () { self.setState({ filter: label }); }
};
});
return { items: items, filters: filters, count: PROYECTOS.length };
}
}
</script>
</body>
</html>
